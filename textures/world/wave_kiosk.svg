<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wave_blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1eaaf1"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fond bleu iconique Wave -->
  <rect width="512" height="512" rx="36" fill="url(#wave_blue)"/>
  <rect x="16" y="16" width="480" height="480" rx="24" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.4"/>

  <!-- Logo Pingouin Wave -->
  <g transform="translate(256, 150)" filter="url(#drop)">
    <!-- Corps du pingouin -->
    <ellipse cx="0" cy="0" rx="60" ry="75" fill="#ffffff"/>
    <ellipse cx="0" cy="8" rx="42" ry="58" fill="#1eaaf1"/>
    <!-- Ventre blanc -->
    <ellipse cx="0" cy="18" rx="28" ry="40" fill="#ffffff"/>
    <!-- Yeux -->
    <circle cx="-16" cy="-22" r="6" fill="#0f172a"/>
    <circle cx="16" cy="-22" r="6" fill="#0f172a"/>
    <!-- Bec orange -->
    <polygon points="0,-12 -12,0 12,0" fill="#f59e0b"/>
    <!-- Pieds orange -->
    <ellipse cx="-20" cy="72" rx="14" ry="8" fill="#f59e0b"/>
    <ellipse cx="20" cy="72" rx="14" ry="8" fill="#f59e0b"/>
  </g>

  <!-- Nom Wave -->
  <text x="256" y="280" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="#ffffff" text-anchor="middle" letter-spacing="-2" filter="url(#drop)">
    wave
  </text>

  <!-- Séparateur -->
  <line x1="80" y1="310" x2="432" y2="310" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Slogans de services -->
  <text x="256" y="355" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle">
    DÉPÔTS &amp; RETRAITS
  </text>
  
  <rect x="76" y="380" width="360" height="48" rx="24" fill="#ffffff" filter="url(#drop)"/>
  <text x="256" y="413" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#0284c7" text-anchor="middle">
    1% SEULEMENT PARTOUT
  </text>

  <text x="256" y="465" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#ffffff" opacity="0.9" text-anchor="middle">
    PAIEMENT FACTURES • SENELEC • Woyofal
  </text>
</svg>