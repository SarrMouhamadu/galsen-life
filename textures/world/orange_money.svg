<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="orange_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7900"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow_om" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fond noir élégant d'Orange -->
  <rect width="512" height="512" rx="36" fill="#18181b"/>
  <rect x="16" y="16" width="480" height="480" rx="24" fill="none" stroke="#ff7900" stroke-width="8"/>

  <!-- Carré Orange iconique -->
  <rect x="80" y="60" width="80" height="80" rx="8" fill="url(#orange_grad)" filter="url(#shadow_om)"/>

  <!-- Logo Orange Money Text -->
  <text x="180" y="105" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="38" fill="#ffffff">
    orange<tspan font-size="22" dy="-14">™</tspan>
  </text>
  <text x="180" y="138" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ff7900" letter-spacing="1">
    money
  </text>

  <!-- Séparateur lumineux -->
  <rect x="64" y="170" width="384" height="6" fill="#ff7900" rx="3"/>

  <!-- Zone de services -->
  <rect x="48" y="200" width="416" height="170" rx="16" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>

  <text x="256" y="245" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">
    POINT AGRÉÉ SÉNÉGAL
  </text>
  <text x="256" y="285" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#fb923c" text-anchor="middle">
    • DÉPÔTS &amp; RETRAITS D'ARGENT •
  </text>
  <text x="256" y="320" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#d4d4d8" text-anchor="middle">
    Transferts Internationaux &amp; Sous-région
  </text>
  <text x="256" y="350" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#d4d4d8" text-anchor="middle">
    Achat Crédit Seddo • Pass Internet
  </text>

  <!-- Bouton d'action bas -->
  <rect x="80" y="400" width="352" height="60" rx="30" fill="url(#orange_grad)" filter="url(#shadow_om)"/>
  <text x="256" y="438" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    DISPONIBILITÉ CASH 100%
  </text>
</svg>