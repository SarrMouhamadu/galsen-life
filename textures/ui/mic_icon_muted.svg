<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Découpe nette de la barre oblique pour créer le gap d'espacement (stencil) comme dans l'image 2 -->
    <mask id="cutout_slash">
      <rect width="128" height="128" fill="#ffffff"/>
      <!-- Barre d'espacement oblique à 45° traversant de haut-droite à bas-gauche -->
      <line x1="98" y1="24" x2="30" y2="92" stroke="#000000" stroke-width="13" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Fond circulaire sombre avec liseré d'alerte discret -->
  <circle cx="64" cy="64" r="58" fill="#201215" stroke="#dc2626" stroke-width="2.5"/>

  <!-- Silhouette du microphone avec découpe au passage de la barre -->
  <g mask="url(#cutout_slash)">
    <!-- Capsule -->
    <rect x="48" y="25" width="32" height="52" rx="16" fill="#ffffff"/>
    <!-- Berceau en U -->
    <path d="M 36,55 C 36,81 92,81 92,55" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Pied vertical -->
    <line x1="64" y1="81" x2="64" y2="100" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Socle horizontal comme dans l'image 2 -->
    <line x1="46" y1="100" x2="82" y2="100" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
  </g>

  <!-- Barre oblique traversante rouge vif (comme dans l'image 2, symbolisant le micro coupé) -->
  <line x1="98" y1="24" x2="30" y2="92" stroke="#ef4444" stroke-width="7.5" stroke-linecap="round"/>
</svg>