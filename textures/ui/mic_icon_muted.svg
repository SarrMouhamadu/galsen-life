<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Capsule du microphone -->
  <rect x="25" y="10" width="14" height="26" rx="7" fill="#e2e8f0"/>
  <!-- Berceau en U -->
  <path d="M 19,25 C 19,40 45,40 45,25" fill="none" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Pied vertical -->
  <line x1="32" y1="40" x2="32" y2="49" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Socle horizontal -->
  <line x1="23" y1="49" x2="41" y2="49" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Ombre de la croix -->
  <line x1="12" y1="12" x2="52" y2="52" stroke="#000000" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  <line x1="52" y1="12" x2="12" y2="52" stroke="#000000" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  <!-- Croix rouge -->
  <line x1="12" y1="12" x2="52" y2="52" stroke="#e63946" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="52" y1="12" x2="12" y2="52" stroke="#e63946" stroke-width="4.5" stroke-linecap="round"/>
</svg>
