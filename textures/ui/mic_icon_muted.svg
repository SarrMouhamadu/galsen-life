<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Découpe nette de la croix sur la silhouette du micro pour lisibilité parfaite -->
    <mask id="cutout_cross">
      <rect width="128" height="128" fill="#ffffff"/>
      <line x1="97" y1="31" x2="31" y2="97" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      <line x1="31" y1="31" x2="97" y2="97" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Fond circulaire sombre avec liseré rouge -->
  <circle cx="64" cy="64" r="58" fill="#231417" stroke="#dc2626" stroke-width="3"/>

  <!-- Silhouette du micro avec découpe de passage -->
  <g mask="url(#cutout_cross)">
    <rect x="49" y="25" width="30" height="52" rx="15" fill="#e2e8f0"/>
    <path d="M 38,58 C 38,84 90,84 90,58" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
    <line x1="64" y1="84" x2="64" y2="100" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
    <line x1="48" y1="100" x2="80" y2="100" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Ombres des barres de la croix pour relief -->
  <line x1="97" y1="31" x2="31" y2="97" stroke="#000000" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
  <line x1="31" y1="31" x2="97" y2="97" stroke="#000000" stroke-width="10" stroke-linecap="round" opacity="0.35"/>

  <!-- Croix rouge traversante (barre + contre-barre formant une croix nette 'X') -->
  <line x1="97" y1="31" x2="31" y2="97" stroke="#ef4444" stroke-width="7.5" stroke-linecap="round"/>
  <line x1="31" y1="31" x2="97" y2="97" stroke="#ef4444" stroke-width="7.5" stroke-linecap="round"/>
</svg>
