<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <!-- Découpe nette autour de la barre diagonale comme sur l'image de référence -->
    <mask id="cutout">
      <rect width="100" height="100" fill="#ffffff"/>
      <line x1="77" y1="21" x2="23" y2="75" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Silhouette du micro avec découpe de passage -->
  <g mask="url(#cutout)">
    <rect x="36" y="16" width="28" height="50" rx="14" fill="#e2e8f0"/>
    <path d="M 26,48 C 26,73 74,73 74,48" fill="none" stroke="#e2e8f0" stroke-width="6.5" stroke-linecap="round"/>
    <line x1="50" y1="73" x2="50" y2="87" stroke="#e2e8f0" stroke-width="6.5" stroke-linecap="round"/>
    <line x1="34" y1="87" x2="66" y2="87" stroke="#e2e8f0" stroke-width="6.5" stroke-linecap="round"/>
  </g>

  <!-- Ombre douce sous la barre -->
  <line x1="77" y1="21" x2="23" y2="75" stroke="#000000" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
  <!-- Barre diagonale rouge de coupure micro (exactement selon l'image de référence) -->
  <line x1="77" y1="21" x2="23" y2="75" stroke="#ef4444" stroke-width="6.5" stroke-linecap="round"/>
</svg>
