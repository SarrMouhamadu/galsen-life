<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Silhouette du microphone en direct (micro actif), aligné sur la même géométrie vectorielle -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Capsule centrale avec sommets arrondis -->
    <rect x="48" y="22" width="32" height="52" rx="16" fill="#ffffff" stroke="none"/>
    <!-- Berceau en U -->
    <path d="M 36,54 C 36,82 92,82 92,54" fill="none" stroke="#ffffff" stroke-width="8"/>
    <!-- Pied vertical -->
    <line x1="64" y1="82" x2="64" y2="102" stroke="#ffffff" stroke-width="8"/>
    <!-- Socle horizontal -->
    <line x1="44" y1="102" x2="84" y2="102" stroke="#ffffff" stroke-width="8"/>
  </g>
</svg>
