<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Découpe nette de la barre oblique pour créer le gap d'espacement (stencil) comme dans l'image de référence -->
    <mask id="cutout_slash">
      <rect width="128" height="128" fill="#ffffff"/>
      <!-- Barre d'espacement oblique à 45° traversant de haut-droite (94, 28) à bas-gauche (34, 88) -->
      <line x1="94" y1="28" x2="34" y2="88" stroke="#000000" stroke-width="15" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Silhouette du microphone avec découpe au passage de la barre -->
  <g mask="url(#cutout_slash)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Capsule centrale avec sommets arrondis -->
    <rect x="48" y="22" width="32" height="52" rx="16" fill="#ffffff" stroke="none"/>
    <!-- Berceau en U -->
    <path d="M 36,54 C 36,82 92,82 92,54" fill="none" stroke="#ffffff" stroke-width="8"/>
    <!-- Pied vertical -->
    <line x1="64" y1="82" x2="64" y2="102" stroke="#ffffff" stroke-width="8"/>
    <!-- Socle horizontal comme dans la référence utilisateur -->
    <line x1="44" y1="102" x2="84" y2="102" stroke="#ffffff" stroke-width="8"/>
  </g>

  <!-- Barre oblique traversante rouge vif (symbolisant le micro coupé avec le biseau de la référence) -->
  <line x1="94" y1="28" x2="34" y2="88" stroke="#ef4444" stroke-width="8.5" stroke-linecap="round"/>
</svg>
